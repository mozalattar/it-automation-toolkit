name: Release

# Publish a release on GitHub (Releases → Draft a new release → tag like v2.0.0),
# or push a tag like v2.0.1, and this builds IntuneWinAppUtilGUI.exe from the
# script and attaches it, with zipped scripts, to that release.
on:
  release:
    types: [published]
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build IntuneWinAppUtilGUI.exe with PS2EXE
        shell: pwsh
        run: |
          Install-Module ps2exe -Force -Scope CurrentUser
          Invoke-ps2exe -inputFile windows/intunewin-gui/IntuneWinAppUtilGUI.ps1 `
            -outputFile IntuneWinAppUtilGUI.exe -noConsole -STA `
            -title 'IntuneWinAppUtil GUI' -company 'Mohammed AlAttar' -version ('${{ github.event.release.tag_name || github.ref_name }}'.TrimStart('v'))
      - name: Package the macOS scripts
        shell: pwsh
        run: |
          Compress-Archive -Path macos/* -DestinationPath macos-scripts.zip
          Compress-Archive -Path windows/lenovo-warranty/* -DestinationPath lenovo-warranty.zip
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          generate_release_notes: true
          files: |
            IntuneWinAppUtilGUI.exe
            macos-scripts.zip
            lenovo-warranty.zip
